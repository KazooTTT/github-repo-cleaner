name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check npm package
        id: npm-package
        run: |
          package_name="$(node -p "require('./package.json').name")"

          if npm view "$package_name" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop first publish without token
        if: steps.npm-package.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::This package has not been published to npm yet. Add a temporary NPM_TOKEN repository secret for the first publish, or run 'npm publish --access public' locally as the npm scope owner. After the package exists, trusted publishing can run without NPM_TOKEN."
            exit 1
          fi

      - name: Publish first version to npm with token
        if: steps.npm-package.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Publish to npm with trusted publishing
        if: steps.npm-package.outputs.exists == 'true'
        run: npm publish
